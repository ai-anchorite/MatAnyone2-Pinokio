[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.yapf]
based_on_style = "pep8"
indent_width = 4
column_limit = 100

[project]
name = "matanyone2"
version = "1.0.0"
authors = [{ name = "Peiqing Yang", email = "peiqingyang99@outlook.com" }]
description = ""
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  'numpy >= 1.21',
  'Pillow >= 9.5, < 12.0',
  'opencv-python >= 4.8',
  'scipy >= 1.7',
  'tqdm >= 4.66.1',
  'gradio == 5.49.1',
  'einops >= 0.6',
  'hydra-core >= 1.3.2',
  'charset-normalizer >= 3.1.0',
  'requests',
  'imageio == 2.25.0',
  'imageio[ffmpeg]',
  'huggingface_hub == 0.36.2',
  'safetensors',
]

[tool.hatch.build.targets.wheel]
packages = ["matanyone2"]

[project.urls]
"Homepage" = "https://github.com/pq-yang/MatAnyone2"
"Bug Tracker" = "https://github.com/pq-yang/MatAnyone2/issues"

[tool.setuptools]
package-dir = {"" = "."}
